name: ayna
x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  MESHY_API_KEY: ${MESHY_API_KEY:-}
  MESHY_DAILY_REQUEST_LIMIT: ${MESHY_DAILY_REQUEST_LIMIT:-0}
  GENERATION_SELLER_DAILY_LIMIT: ${GENERATION_SELLER_DAILY_LIMIT:-20}
  MESHY_POLL_SECONDS: ${MESHY_POLL_SECONDS:-10}
  MESHY_TIMEOUT_SECONDS: ${MESHY_TIMEOUT_SECONDS:-900}
  TRIPO_API_KEY: ${TRIPO_API_KEY:-}
  TRIPO_DAILY_REQUEST_LIMIT: ${TRIPO_DAILY_REQUEST_LIMIT:-0}
  TRIPO_POLL_SECONDS: ${TRIPO_POLL_SECONDS:-10}
  TRIPO_TIMEOUT_SECONDS: ${TRIPO_TIMEOUT_SECONDS:-900}
  GENERATION_STALE_SECONDS: ${GENERATION_STALE_SECONDS:-600}
  DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ayna}:${POSTGRES_PASSWORD:-ayna-local-only-change-me}@postgres:5432/${POSTGRES_DB:-ayna}
  REDIS_URL: redis://redis:6379/0
  QUEUE_MODE: rq
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ayna-local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-ayna-local-only-change-me}
  S3_BUCKET: ${S3_BUCKET:-ayna-private}
  ASSET_SIGNING_KEY: ${ASSET_SIGNING_KEY:-ayna-local-signing-key-change-before-production}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
  MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
  MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
  CURRENCY: ${CURRENCY:-BDT}
  STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:5173}
  DEMO_PAYMENTS_ENABLED: ${DEMO_PAYMENTS_ENABLED:-true}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-Ayna <noreply@example.com>}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  QUALITY_DEVICE: ${QUALITY_DEVICE:-cpu}
  QUALITY_MAX_IMAGE_SIZE: ${QUALITY_MAX_IMAGE_SIZE:-384}
  QUALITY_ENABLE_SAM2: ${QUALITY_ENABLE_SAM2:-false}
  QUALITY_ENABLE_DINOV2: ${QUALITY_ENABLE_DINOV2:-false}
  QUALITY_ENABLE_OPENCV_ALIGNMENT: ${QUALITY_ENABLE_OPENCV_ALIGNMENT:-false}
  QUALITY_SAM2_CONFIG: ${QUALITY_SAM2_CONFIG:-}
  QUALITY_SAM2_CHECKPOINT: ${QUALITY_SAM2_CHECKPOINT:-}
  QUALITY_DINOV2_MODEL_PATH: ${QUALITY_DINOV2_MODEL_PATH:-}
  BLENDER_OPTIMIZATION_ENABLED: ${BLENDER_OPTIMIZATION_ENABLED:-false}
  BLENDER_EXECUTABLE: ${BLENDER_EXECUTABLE:-}
  BLENDER_TIMEOUT_SECONDS: ${BLENDER_TIMEOUT_SECONDS:-180}
  BLENDER_TARGET_TRIANGLES: ${BLENDER_TARGET_TRIANGLES:-20000}
  TRYON_PROVIDER: ${TRYON_PROVIDER:-diagnostic}
  TRYON_RETENTION_HOURS: ${TRYON_RETENTION_HOURS:-24}
  TRYON_MAX_IMAGE_BYTES: ${TRYON_MAX_IMAGE_BYTES:-10485760}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayna}
      POSTGRES_USER: ${POSTGRES_USER:-ayna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayna-local-only-change-me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build: ./infra/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ayna-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ayna-local-only-change-me}
    ports: ['127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
  storage-init:
    image: ayna-backend:local
    pull_policy: never
    environment: *app-env
    command: [python, -m, scripts.init_storage]
    depends_on:
      minio: {condition: service_healthy}
  migrate:
    image: ayna-backend:local
    pull_policy: never
    environment: *app-env
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: ./backend
    image: ayna-backend:local
    environment: *app-env
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    image: ayna-backend:local
    pull_policy: never
    environment: *app-env
    command: [python, -m, app.worker]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, scripts.worker_health]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ['127.0.0.1:${WEB_PORT:-5173}:5173']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
